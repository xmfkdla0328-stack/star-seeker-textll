<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Seeker: TextLL</title>
  <!-- 테일윈드 CSS CDN을 이용해 고품질 테마 스타일링 적용 -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- 네비게이션 헤더 -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🌌</span>
      <h1 class="text-xl font-bold tracking-wider text-slate-100 font-mono">STAR SEEKER <span class="text-amber-500 font-light text-sm">TEXT-LL</span></h1>
    </div>
    <div class="text-xs text-slate-500 font-mono">V1.1 ALPHA ARCHITECTURE</div>
  </header>

  <!-- 메인 레이아웃 Grid (컨텐츠 영역 & 정보 사이드바) -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- 왼쪽: 스토리 대화 & 선택지 영역 (3개 컬럼 차지) -->
    <section class="md:col-span-3 flex flex-col space-y-6">
      
      <!-- 스토리 로그 보드 -->
      <div class="bg-slate-900/40 border border-slate-900 rounded-lg p-6 flex-1 flex flex-col justify-between min-h-[300px] shadow-inner">
        <div>
          <!-- 현재 노드 타이틀 -->
          <h2 id="story-title" class="text-amber-500 font-semibold text-lg mb-4 font-mono tracking-wide border-b border-slate-800 pb-2">
            데이터 수신 대기 중...
          </h2>
          <!-- 텍스트 로그 컨텐츠 -->
          <p id="story-text" class="text-slate-300 leading-relaxed text-base whitespace-pre-line tracking-wide">
            기지에 연결을 초기화하는 중입니다... 잠시만 기다려 주십시오.
          </p>
        </div>
      </div>

      <!-- 선택지 영역 -->
      <div class="space-y-3">
        <h3 class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-2">선택 가능한 경로 (Choices)</h3>
        <div id="choice-container" class="space-y-2">
          <!-- 스크립트가 동적으로 생성할 선택 버튼 위치 -->
        </div>
      </div>

    </section>

    <!-- 오른쪽: 상태창 및 전역 수집 정보 사이드바 (1개 컬럼 차지) -->
    <aside class="space-y-6">
      
      <!-- 플레이어 실시간 스탯 상태 모니터 -->
      <div class="bg-slate-900/60 border border-slate-900 rounded-lg p-4 shadow-sm">
        <h3 class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-4 pb-1 border-b border-slate-800">우주선 계기판</h3>
        <div class="space-y-3">
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-400">❤️ 선체 외장 (HP)</span>
            <span id="stat-health" class="text-emerald-400 font-bold font-mono">100%</span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-400">⛽ 연료 셀 (FUEL)</span>
            <span id="stat-fuel" class="text-amber-500 font-bold font-mono">5</span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-400">🪙 성간 신용 (GOLD)</span>
            <span id="stat-credits" class="text-cyan-400 font-bold font-mono">50G</span>
          </div>
        </div>
      </div>

      <!-- 탐사 획득 단서 및 키워드 리스트 -->
      <div class="bg-slate-900/60 border border-slate-900 rounded-lg p-4 shadow-sm">
        <h3 class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-4 pb-1 border-b border-slate-800">탐색 기록 (Keywords)</h3>
        <div id="keyword-list" class="flex flex-wrap gap-2">
          <!-- 획득한 단서 및 키워드 배지 동적 생성 구역 -->
          <span class="text-slate-500 text-sm">획득한 주요 단서 없음</span>
        </div>
      </div>

    </aside>

  </main>

  <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600 font-mono">
    © 2026 STAR SEEKER TEAM. POWERED BY DATA-DRIVEN TEXT ENGINE.
  </footer>

  <!-- 메인 모듈 스크립트 바인딩 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
